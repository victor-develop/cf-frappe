name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Generated browser bundles are fresh
        run: npm run check:client-fresh

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The Playwright web server starts `wrangler dev`, and when that fails
      # wrangler prints an empty `✘ [ERROR]` and writes the real message to a log
      # file. Without surfacing it, every failure looks like ERR_CONNECTION_REFUSED
      # with no cause. See #44.
      - name: Browser journeys
        run: npm run test:browser

      - name: Wrangler logs on failure
        if: failure()
        run: |
          shopt -s nullglob
          logs=(~/.config/.wrangler/logs/*.log .wrangler/logs/*.log)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "no wrangler logs found"
          fi
          for log in "${logs[@]}"; do
            echo "===== $log"
            tail -200 "$log"
          done

      - name: Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Architecture-critical coverage
        run: npm run coverage

      - name: Naming reliability per-file coverage
        run: npm run coverage:naming

      - name: Build
        run: npm run build
